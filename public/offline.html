<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e121b" />
    <title>You're offline — Matrix AI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0e121b;
        color: #f1f5f9;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 2rem;
        place-items: center;
        text-align: center;
      }

      main {
        width: min(100%, 28rem);
      }

      img {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(1.75rem, 8vw, 2.5rem);
        letter-spacing: -0.04em;
      }

      p {
        color: #a6b0c1;
        line-height: 1.6;
      }

      button {
        min-height: 2.75rem;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #67e8f9;
        color: #0e121b;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/matrix-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Matrix AI couldn't reach the network. Check your connection and try again. Your account and conversations stay protected.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
