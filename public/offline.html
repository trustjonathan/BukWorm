<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121315" />
    <meta name="color-scheme" content="dark" />
    <title>Connection unavailable - Matrix AI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #121315;
        color: #f1f5f9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem
          max(1.25rem, env(safe-area-inset-bottom));
        place-items: center;
        background: #121315;
      }

      main {
        width: min(100%, 28rem);
        padding: clamp(1.5rem, 7vw, 2.5rem);
        border: 1px solid rgb(148 163 184 / 16%);
        border-radius: 1.5rem;
        background: #1a1b1e;
        box-shadow: 0 24px 80px rgb(0 0 0 / 28%);
        text-align: center;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 2rem;
        padding: 0.35rem 0.75rem;
        border: 1px solid rgb(251 191 36 / 24%);
        border-radius: 999px;
        background: rgb(251 191 36 / 8%);
        color: #fcd34d;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status-dot {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: currentColor;
      }

      .illustration {
        display: grid;
        width: 5.5rem;
        height: 5.5rem;
        margin: 2rem auto 1.5rem;
        place-items: center;
        border: 1px solid rgb(103 232 249 / 18%);
        border-radius: 1.75rem;
        background: #153035;
        color: #67e8f9;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 8vw, 2.25rem);
        letter-spacing: -0.04em;
      }

      .description {
        margin: 1rem 0 0;
        color: #a6b0c1;
        font-size: 1rem;
        line-height: 1.7;
      }

      .reconnect-note {
        min-height: 1.5em;
        margin: 1rem 0 0;
        color: #cbd5e1;
        font-size: 0.875rem;
        line-height: 1.5;
      }

      button {
        width: 100%;
        min-height: 3.25rem;
        margin-top: 1.75rem;
        padding: 0.8rem 1.25rem;
        border: 0;
        border-radius: 0.8rem;
        background: #67e8f9;
        color: #121315;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      button:hover {
        background: #a5f3fc;
      }

      button:active {
        transform: scale(0.98);
      }

      button:focus-visible {
        outline: 3px solid #f1f5f9;
        outline-offset: 3px;
      }

      .privacy-note {
        margin: 1.25rem 0 0;
        color: #7f8ba0;
        font-size: 0.75rem;
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status" id="connection-status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="connection-label">Offline notice</span>
      </div>
      <div class="illustration" aria-hidden="true">
        <svg
          width="42"
          height="42"
          viewBox="0 0 42 42"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M5 15.5C14.3 7.3 27.7 7.3 37 15.5M11 22C16.8 16.9 25.2 16.9 31 22M17.2 28.5C19.4 26.6 22.6 26.6 24.8 28.5M21 35h.02"
            stroke="currentColor"
            stroke-width="2.8"
            stroke-linecap="round"
          />
          <path
            d="M7 7l28 28"
            stroke="currentColor"
            stroke-width="2.8"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p class="description">
        Matrix AI can't connect right now. Check your internet connection and try
        again when you're back online.
      </p>
      <p class="reconnect-note" id="reconnect-note" aria-live="polite">
        Your conversations will be here when you reconnect.
      </p>
      <button id="retry-button" type="button">Try again</button>
      <p class="privacy-note">
        For your privacy, conversations aren't saved for offline use.
      </p>
    </main>
    <script>
      const connectionLabel = document.getElementById("connection-label")
      const reconnectNote = document.getElementById("reconnect-note")
      const retryButton = document.getElementById("retry-button")

      function updateConnectionNotice() {
        if (navigator.onLine) {
          connectionLabel.textContent = "Connection restored"
          reconnectNote.textContent = "You're back online. Try opening Matrix AI again."
          retryButton.textContent = "Reload Matrix AI"
          return
        }

        connectionLabel.textContent = "Offline notice"
        reconnectNote.textContent = "Your conversations will be here when you reconnect."
        retryButton.textContent = "Try again"
      }

      window.addEventListener("online", updateConnectionNotice)
      window.addEventListener("offline", updateConnectionNotice)
      retryButton.addEventListener("click", () => window.location.reload())
      updateConnectionNotice()
    </script>
  </body>
</html>
